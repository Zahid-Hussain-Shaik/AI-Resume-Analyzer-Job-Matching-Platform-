services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["resume-db:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/resume_analyzer?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 5000
    ports: ["5000:5000"]
    depends_on: [db]
    volumes: ["./uploads:/app/uploads"]
volumes:
  resume-db:
